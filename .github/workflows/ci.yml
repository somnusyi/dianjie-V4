name: release-gates

on:
  push:
    branches: [main, "release/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dianjie_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dianjie_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/dianjie_ci?schema=public
      JWT_SECRET: ci-only-not-a-production-secret
      NEXT_PUBLIC_API_BASE_URL: http://127.0.0.1:4004

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @dianjie/db exec prisma generate --schema=prisma/schema.prisma

      - name: Rebuild schema from all migrations
        run: pnpm --filter @dianjie/db exec prisma migrate deploy --schema=prisma/schema.prisma

      - name: Verify migration status and schema drift
        run: |
          pnpm --filter @dianjie/db exec prisma migrate status --schema=prisma/schema.prisma
          pnpm --filter @dianjie/db exec prisma migrate diff \
            --from-schema-datasource prisma/schema.prisma \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code

      - name: API tests and build
        run: |
          pnpm --filter @dianjie/api test
          pnpm --filter @dianjie/api test:integration
          pnpm --filter @dianjie/api build

      - name: Web tests, typecheck and production build
        run: |
          pnpm --filter @dianjie/web test
          pnpm --filter @dianjie/web exec tsc --noEmit
          pnpm --filter @dianjie/web build
