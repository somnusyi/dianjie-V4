<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>011 · 单订单详情视觉对比</title>
  <style>
    :root{--bg:#f6f5f2;--card:#fff;--ink:#211d19;--muted:#77716a;--line:#e6e1da;--amber:#d98318;--amber-bg:#fff4df;--red:#b43a31;--red-bg:#fff0ed;--green:#287853;--green-bg:#eaf7f0}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}.page{min-height:100vh;padding-bottom:94px}.bar{display:flex;align-items:center;gap:8px;padding:16px 16px 8px}.bar h1{flex:1;margin:0;font-size:20px}.btn,.icon{border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 12px;color:var(--ink);cursor:pointer}.icon{width:38px;height:38px;padding:0;font-size:22px}.chip{padding:4px 10px;border-radius:999px;background:var(--amber-bg);color:#945309;font-size:12px;font-weight:650}.card{margin:10px 16px 0;background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}.pad{padding:16px}.micro{font-size:11px;color:var(--muted)}.caption{font-size:13px;color:var(--muted)}.amount-top{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-top:4px}.amount-top h2{font-size:18px;margin:0}.amount{text-align:right}.amount b{display:block;font-size:23px}.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}.facts b{display:block}.progress{display:flex;align-items:flex-start;justify-content:space-between}.step{width:20%;text-align:center;font-size:11px;color:var(--muted);position:relative}.step:before{content:"";display:block;width:10px;height:10px;margin:0 auto 7px;border:2px solid #bbb4ac;background:#fff;border-radius:50%;position:relative;z-index:1}.step:not(:last-child):after{content:"";height:2px;background:#dcd7d1;position:absolute;left:55%;right:-45%;top:5px}.step.on:before{border-color:var(--amber);background:var(--amber)}.section-head{display:flex;align-items:center;gap:8px;padding:13px 12px 10px}.section-head h2{margin:0;font-size:16px}.section-head .sum{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums}.primary{border:0;background:var(--ink);color:#fff;border-radius:10px;padding:8px 17px;font-weight:650;cursor:pointer}.primary:disabled{opacity:.35}.outline-amber{border:1px solid var(--amber);color:#9a5b0a;background:#fff;border-radius:9px;padding:5px 9px;cursor:pointer}table{width:100%;border-collapse:collapse;min-width:760px}th{background:var(--bg);font-size:11px;color:var(--muted);font-weight:500;text-align:left}th,td{padding:10px 12px;border-top:1px solid var(--line)}th.num,td.num{text-align:right;font-variant-numeric:tabular-nums}.qty{display:inline-flex;align-items:center;gap:5px}.qty input{width:78px;padding:6px;border:1px solid var(--line);border-radius:8px;text-align:right;font:inherit}.remove{border:1px solid #d9a29d;background:#fff;color:var(--red);border-radius:8px;padding:5px 8px;cursor:pointer}.dirty{background:var(--red-bg);color:var(--red)}.dirty .qty input{border-color:var(--red);color:var(--red)}.notice{display:none;margin:0 12px 10px;padding:9px 11px;border-radius:9px;background:var(--green-bg);color:var(--green)}.bottom{position:fixed;left:0;right:0;bottom:0;border-top:1px solid var(--line);background:rgba(255,255,255,.96);padding:12px 16px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.danger{border:1px solid var(--red);background:#fff;color:var(--red);border-radius:11px;padding:12px;font-weight:650}.accept{border:0;background:var(--ink);color:#fff;border-radius:11px;padding:12px;font-weight:650}.meta{max-width:980px;margin:0 auto}.preview-note{margin:8px 16px 0;padding:8px 11px;border-left:3px solid var(--amber);background:#fff9ed;color:#785626;font-size:12px}.drawer{display:none;position:fixed;inset:0;background:#211d1977;z-index:5;align-items:flex-end;justify-content:center}.drawer.open{display:flex}.sheet{background:#fff;width:min(520px,100%);border-radius:18px 18px 0 0;padding:16px}.catalog{border:1px solid var(--line);border-radius:10px;margin-top:12px}.catalog button{width:100%;padding:12px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left}.catalog button:last-child{border:0}@media(max-width:700px){.bar{padding-left:12px;padding-right:12px}.card{margin-left:10px;margin-right:10px}.preview-note{margin-left:10px;margin-right:10px}.section-head{flex-wrap:wrap}.facts{grid-template-columns:1fr 1fr 1fr}}
  </style>
</head>
<body>
  <div class="meta">
    <div class="preview-note">静态视觉稿 · 示例数据 · 不连接 API。页头、金额卡、进度、商品明细均按 <code>order-detail-shared.tsx</code> 的共享模块生成。</div>
    <div id="shared-root" data-source-component="apps/web/src/components/v2/order-detail-shared.tsx"></div>
    <div class="bottom"><button class="danger">拒单</button><button class="accept">接单</button></div>
  </div>
  <div class="drawer" id="drawer"><div class="sheet"><div style="display:flex;align-items:center"><b style="font-size:17px;flex:1">增加商品</b><button class="btn" onclick="drawer.classList.remove('open')">关闭</button></div><div class="catalog"><button onclick="addProduct('有机娃娃菜','300g / 包','包',6.8)">有机娃娃菜<br><span class="micro">300g / 包 · ¥6.80</span></button><button onclick="addProduct('鲜冬菇','500g / 份','份',9.5)">鲜冬菇<br><span class="micro">500g / 份 · ¥9.50</span></button></div></div></div>
  <script>
    const model={title:'订单详情',status:'待接单',eyebrow:'#LOCAL-PO-20260902100103-05',name:'云玺路店',amountLabel:'实发金额',amount:'228.00',originalOrderAmount:'228.00',details:'下单 09/02 10:01 · 期望到货 09/03<br>创建人 王店长',step:0,editable:true,rows:[{name:'精品西红柿',spec:'500g / 份',unit:'份',quantity:6,price:12.5},{name:'嫩小白菜',spec:'400g / 份',unit:'份',quantity:8,price:8.5},{name:'云南小瓜',spec:'500g / 份',unit:'份',quantity:5,price:17}]};
    function money(n){return Number(n).toLocaleString('zh-CN',{minimumFractionDigits:2,maximumFractionDigits:2})}
    function renderSharedOrderDetail(m){
      const bodyRows=m.rows.map((r,i)=>`<tr data-original="${r.quantity}"><td>${i+1}</td><td>${r.name}${r.source?`<span class="source">${r.source}</span>`:''}</td><td class="caption">${r.spec||'-'}</td><td class="num"><span class="qty"><input type="number" min="0" step="0.01" value="${r.quantity}" oninput="editQty(this)"><span class="caption">${r.unit}</span></span></td><td class="num">¥${money(r.price)}</td><td class="num line-total">¥${money(r.quantity*r.price)}</td><td class="num"><button class="remove" onclick="removeRow(this)">移除</button></td></tr>`).join('');
      const guidance=m.notice?`<div class="notice">${m.notice}</div>`:'';
      return `<header class="bar"><button class="icon">‹</button><h1>${m.title}</h1><button class="btn">🖨 送货单</button><span class="chip">${m.status}</span></header><section class="card pad"><div class="micro">${m.eyebrow}</div><div class="amount-top"><h2>${m.name}</h2><div class="amount"><span class="micro">${m.amountLabel}</span><b>¥<span id="shipment-amount">${m.amount}</span></b><span class="micro">原始订单金额 ¥${m.originalOrderAmount}</span></div></div><div class="caption" style="margin-top:9px">${m.details}</div></section><section class="card pad"><div class="progress">${['已发起','已接单','在途','送达','门店已收'].map((x,i)=>`<div class="step ${i<=m.step?'on':''}">${x}</div>`).join('')}</div></section><section class="card"><div class="section-head"><h2>商品明细 (<span id="count">${m.rows.length}</span>)</h2><button class="outline-amber" onclick="drawer.classList.add('open')">＋ 增加商品</button><span class="sum">合计 ¥<span id="total"></span></span><button id="save" class="primary" disabled onclick="saveRows()">保存</button></div><div id="success" class="notice success">${m.successMessage||'商品明细已保存'}</div>${guidance}<div style="overflow:auto"><table><thead><tr><th>序号</th><th>名称</th><th>规格</th><th class="num">数量</th><th class="num">单价</th><th class="num">总价</th><th class="num">操作</th></tr></thead><tbody id="rows">${bodyRows}</tbody></table></div></section>`;
    }
    sharedRoot.innerHTML=renderSharedOrderDetail(model);
    function recalc(){let sum=0;document.querySelectorAll('#rows tr').forEach((tr,i)=>{tr.cells[0].textContent=i+1;const q=Number(tr.querySelector('input').value||0),p=Number(tr.cells[4].textContent.replace('¥',''));tr.querySelector('.line-total').textContent='¥'+money(q*p);sum+=q*p});total.textContent=money(sum);document.getElementById('shipment-amount').textContent=money(sum);count.textContent=document.querySelectorAll('#rows tr').length}
    function editQty(input){const tr=input.closest('tr');tr.classList.toggle('dirty',Number(input.value)!==Number(tr.dataset.original));save.disabled=false;success.style.display='none';recalc()}
    function removeRow(btn){btn.closest('tr').remove();save.disabled=false;success.style.display='none';recalc()}
    function saveRows(){document.querySelectorAll('#rows tr').forEach(tr=>{tr.dataset.original=tr.querySelector('input').value;tr.classList.remove('dirty')});save.disabled=true;success.style.display='block'}
    function addProduct(name,spec,unit,price){const tr=document.createElement('tr');tr.className='dirty';tr.dataset.original='0';tr.innerHTML=`<td></td><td>${name}</td><td class="caption">${spec}</td><td class="num"><span class="qty"><input type="number" min="0" step="0.01" value="1" oninput="editQty(this)"><span class="caption">${unit}</span></span></td><td class="num">¥${money(price)}</td><td class="num line-total">¥${money(price)}</td><td class="num"><button class="remove" onclick="removeRow(this)">移除</button></td>`;rows.appendChild(tr);drawer.classList.remove('open');save.disabled=false;recalc()}
    recalc();
  </script>
</body>
</html>
